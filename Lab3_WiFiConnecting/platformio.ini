; =====================================================================
;  Template ของบอร์ด ESP32-2432S028 (CYD)  -- Level 1 / Lab 3 : WiFi Connecting
;
;  ไฟล์นี้ตั้งค่าครบสำหรับทั้งคอร์ส (จอ TFT, จอสัมผัส, LVGL) แต่ Lab 3 ใช้แค่
;  Serial + RGB LED + WiFi (ไลบรารี WiFi มากับ Arduino-ESP32 อยู่แล้ว ไม่ต้องติดตั้งเพิ่ม)
;  เมื่อเริ่ม Lab ที่ใช้จอ/LVGL ให้เอา ; หน้าบรรทัด lib_deps ออก
; =====================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ถ้า build แล้วฟ้องว่าโปรแกรมใหญ่เกิน flash (เช่น LVGL + WiFi) ให้เปิดบรรทัดนี้
; board_build.partitions = huge_app.csv

build_flags =
  ; ---- จอ TFT: ไดรเวอร์ ILI9341 และ pin (ต้องตรงกับ include/board_config.h) ----
  -D USER_SETUP_LOADED
  -D ILI9341_DRIVER
  -D USE_HSPI_PORT
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  ; ---- LVGL: ให้หา lv_conf.h ในโฟลเดอร์ include ----
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -Iinclude
  -std=gnu++17

build_unflags =
  -std=gnu++11

; ไลบรารีที่ใช้ใน Lab ถัดไป (เอา ; ออกเมื่อต้องใช้)
; lib_deps =
;   bodmer/TFT_eSPI@^2.5.43
;   https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
;   lvgl/lvgl@~8.3.11
